<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Isabella Havens, IT and Cybersecurity Student at the University of Cincinnati" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .d1 { animation-delay: .4s } .d2 { animation-delay: .9s } .d3 { animation-delay: 1.5s } .d4 { animation-delay: 2.1s } .d5 { animation-delay: 2.7s }
    .flow { stroke-dasharray: 4 8; animation: flow 2.4s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes flow { to { stroke-dashoffset: -24 } }
    @keyframes blink { 50% { fill: transparent } }
    @media (prefers-reduced-motion: reduce) { .pulse, .flow, .cursor { animation: none } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="965" cy="165" r="190" fill="url(#glow)"/>
    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>

    <!-- network -->
    <g stroke-width="1.6" fill="none">
      <g stroke="#2dd4bf" opacity="0.55" class="flow">
        <line x1="965" y1="165" x2="820" y2="90"/>
        <line x1="965" y1="165" x2="1120" y2="195"/>
        <line x1="965" y1="165" x2="870" y2="240"/>
      </g>
      <g stroke="#a78bfa" opacity="0.55" class="flow">
        <line x1="965" y1="165" x2="935" y2="55"/>
        <line x1="965" y1="165" x2="1065" y2="95"/>
        <line x1="965" y1="165" x2="1015" y2="262"/>
        <line x1="965" y1="165" x2="780" y2="175"/>
      </g>
      <g stroke="#ffffff" opacity="0.12">
        <polyline points="780,175 820,90 935,55 1065,95 1120,195 1015,262 870,240 780,175"/>
      </g>
    </g>
    <g>
      <circle cx="820" cy="90" r="7" fill="#2dd4bf" class="pulse"/>
      <circle cx="935" cy="55" r="6" fill="#a78bfa" class="pulse d1"/>
      <circle cx="1065" cy="95" r="7" fill="#a78bfa" class="pulse d2"/>
      <circle cx="1120" cy="195" r="6" fill="#2dd4bf" class="pulse d3"/>
      <circle cx="1015" cy="262" r="7" fill="#f472b6" class="pulse d4"/>
      <circle cx="870" cy="240" r="6" fill="#2dd4bf" class="pulse d5"/>
      <circle cx="780" cy="175" r="6" fill="#f472b6" class="pulse d2"/>
    </g>
    <!-- shield hub -->
    <path d="M965 118 L1007 134 V168 C1007 197 989 215 965 225 C941 215 923 197 923 168 V134 Z" fill="#0b1026" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="965" cy="162" r="9" fill="none" stroke="#f472b6" stroke-width="3"/>
    <path d="M960 168 H970 L973 190 H957 Z" fill="#f472b6"/>

    <!-- text -->
    <text x="72" y="140" class="sans" font-size="64" font-weight="700" fill="#ffffff">Isabella Havens</text>
    <text x="74" y="186" class="sans" font-size="24" fill="#cbd5e1">IT &amp; Cybersecurity Student · University of Cincinnati</text>


    <text x="74" y="248" class="mono" font-size="17" fill="#94a3b8"><tspan fill="#2dd4bf">&gt;</tspan> building apps that are organized, useful, and secure<tspan class="cursor" fill="#2dd4bf">_</tspan></text>
  </g>
</svg>
